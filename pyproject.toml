[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipcheck"
version = "0.1.0"
description = "Independent preview-URL QA for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.0",
  "playwright>=1.49",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
shipcheck = "shipcheck.cli:main"

[tool.setuptools.packages.find]
include = ["shipcheck*"]

[tool.setuptools.package-data]
shipcheck = ["landing.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: hits the public internet and requires Playwright Chromium",
]
